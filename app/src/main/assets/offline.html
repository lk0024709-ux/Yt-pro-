<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>YT Pro - No connection</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            background: #0f0f0f;
            color: #f1f1f1;
            font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-text-size-adjust: 100%;
        }
        .wrap {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 28px;
            text-align: center;
        }
        .logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .logo::after {
            content: "";
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 11px 0 11px 19px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 4px;
        }
        h1 { font-size: 20px; font-weight: 500; margin: 0 0 8px; }
        p { font-size: 14px; line-height: 1.5; color: #aaaaaa; margin: 0 0 28px; max-width: 320px; }
        button {
            appearance: none;
            border: 0;
            border-radius: 24px;
            background: #ff0000;
            color: #ffffff;
            font-size: 15px;
            font-weight: 500;
            padding: 12px 34px;
            cursor: pointer;
        }
        button:active { background: #cc0000; }
        .hint { font-size: 12px; color: #717171; margin-top: 22px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="logo" aria-hidden="true"></div>
    <h1>No connection</h1>
    <p>YT Pro could not reach YouTube. Check your network connection and try again.</p>
    <button type="button" onclick="retryLoad()">Retry</button>
    <div class="hint">YT Pro</div>
</div>
<script>
    function retryLoad() {
        // The native side injects this bridge; fall back to a plain reload when
        // the page is opened outside the app.
        if (window.YTPro && typeof window.YTPro.retry === "function") {
            window.YTPro.retry();
        } else {
            window.location.href = "https://m.youtube.com/";
        }
    }
</script>
</body>
</html>
