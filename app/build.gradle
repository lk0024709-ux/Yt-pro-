plugins {
    id 'com.android.application'
}

android {
    namespace 'com.au.ytpro'
    compileSdk 34

    defaultConfig {
        applicationId "com.au.ytpro"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Keeps the WebView wrapper usable on every Android 5.0+ device.
        resConfigs 'en'
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release builds are unsigned here; see README.md "Signing a release".
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError true
        warningsAsErrors false
        checkReleaseBuilds true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
