plugins {
    id 'com.android.application'
}

android {
    namespace 'com.au.ytpro'
    compileSdk 34

    defaultConfig {
        applicationId "com.au.ytpro"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"

        // 100% native client: runs on every Android 5.0+ device.
        // API 21+ runs on ART, so multidex needs no support library.
        multiDexEnabled true
        resConfigs 'en'
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release builds are unsigned here; see README.md "Signing a release".
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Required by NewPipeExtractor on minSdk < 26: backports the
        // java.time / streams / nio APIs the extractor relies on to API 21+.
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError true
        warningsAsErrors false
        checkReleaseBuilds true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    // Java 8+ API backport for API 21+ (NewPipeExtractor requirement).
    // The _nio variant is the one the extractor documentation recommends.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.4'

    // Core AndroidX UI (BottomNavigationView, RecyclerView/CardView, ViewPager2).
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // ExoPlayer (AndroidX Media3) + HLS/DASH delivery + datasource/database
    // modules for the on-disk playback cache. minSdk 19, so API 21+ is fully
    // supported; the 1.4.x line compiles against SDK 34.
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
    implementation 'androidx.media3:media3-database:1.4.1'
    implementation 'androidx.media3:media3-extractor:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'

    // NewPipeExtractor (JitPack): resolves YouTube audio/video stream URLs,
    // channel info, search and trending feeds directly — no Google API quota.
    // Provides the org.schabi.newpipe.extractor.* packages.
    implementation 'com.github.TeamNewPipe:NewPipeExtractor:v0.26.4'

    // HTTP client behind the extractor downloader. OkHttp 4.x supports
    // Android 5.0+ (API 21+), which matches minSdk exactly.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Video thumbnails / channel avatars.
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
